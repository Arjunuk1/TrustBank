<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Primary Meta Tags -->
  <title>TrustBank | Login</title>
  <meta name="title" content="TrustBank | Login" />
  <meta name="description" content="Login to your TrustBank account or create a new account. Modern, secure banking platform built with Spring Boot. Demo project for educational purposes." />
  <meta name="keywords" content="banking, login, account creation, spring boot, web banking, TrustBank" />
  <meta name="author" content="TrustBank" />
  <meta name="robots" content="noindex, nofollow" />
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#3b82f6" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="TrustBank | Login" />
  <meta property="og:description" content="Login to your TrustBank account. Modern, secure banking platform built with Spring Boot." />
  <meta property="og:image" content="./favicon.svg" />
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary" />
  <meta property="twitter:title" content="TrustBank | Login" />
  <meta property="twitter:description" content="Login to your TrustBank account. Modern, secure banking platform built with Spring Boot." />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="app">
  <div class="disclaimer-banner">
    <div class="disclaimer-content">
      <strong>Demo Application:</strong> Use test data only.
    </div>
  </div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">TB</div>
      <div>
        <h1>TrustBank <span class="demo-badge">DEMO</span></h1>
        <p class="tagline">Secure access portal</p>
      </div>
    </div>
    <a href="home.html" class="btn">Back to Home</a>
  </header>

  <main class="grid">

    <!-- CREATE ACCOUNT -->
    <section class="card">
      <h2>Create Account</h2>
      <p class="muted">Open a demo account in seconds.</p>

      <input id="cname" placeholder="Enter Your Full Name" />
      <input id="cpin" type="password" placeholder="Set a Secure 4-6 Digit PIN" />

      <button class="btn primary" onclick="createAccount(event)">Create Account</button>
      <div class="msg" id="createMsg"></div>
    </section>

    <!-- LOGIN -->
    <section class="card">
      <h2>Login</h2>
      <p class="muted">Access your account dashboard.</p>

      <input id="lacc" placeholder="Account Number" />
      <div class="row">
        <input id="lpin" type="password" placeholder="Enter PIN" />
        <button class="btn" onclick="togglePin()">Show</button>
      </div>

      <button class="btn success" onclick="login(event)">Login</button>
      <div class="msg" id="loginMsg"></div>
    </section>

  </main>

  <footer class="footer">
    <p>© 2026 TrustBank • Educational demo • Not for production use</p>
  </footer>
</div>

<div id="toast" class="toast"></div>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
