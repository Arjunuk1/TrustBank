<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bankGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bankGradient)"/>
  
  <!-- Bank Building -->
  <g fill="white">
    <!-- Roof Triangle -->
    <path d="M 50 20 L 75 35 L 25 35 Z"/>
    
    <!-- Pillars -->
    <rect x="30" y="35" width="8" height="35" rx="1"/>
    <rect x="46" y="35" width="8" height="35" rx="1"/>
    <rect x="62" y="35" width="8" height="35" rx="1"/>
    
    <!-- Base -->
    <rect x="22" y="70" width="56" height="8" rx="1"/>
    
    <!-- Door -->
    <rect x="43" y="55" width="14" height="15" fill="#1e40af" rx="1"/>
  </g>
</svg>
